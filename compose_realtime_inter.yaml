x-ros-realtime: &ros-realtime
  build:
    context: .
    dockerfile: Dockerfile_realtime_inter
    args:
      ONNX_PKG: ${ONNX_PKG:-onnxruntime}
  network_mode: host
  ipc: host

services:
  driver_camara5:
    <<: *ros-realtime
    privileged: true
    command: >
      ros2 run usb_cam usb_cam_node_exe --ros-args
      -r __ns:=/camara5
      -p video_device:=${DEV_CAMARA5:-/dev/video2}
      -p frame_id:=camara5
      -p camera_name:=astra_rgb_5

  driver_camara8:
    <<: *ros-realtime
    privileged: true
    command: >
      ros2 run usb_cam usb_cam_node_exe --ros-args
      -r __ns:=/camara8
      -p video_device:=${DEV_CAMARA8:-/dev/video4}
      -p frame_id:=camara8
      -p camera_name:=astra_rgb_8

  processador:
    <<: *ros-realtime
    depends_on:
      - driver_camara5
      - driver_camara8
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - CAMARAS_ATIVAS=${CAMARAS_ATIVAS}
      - SEM_INTERFACE=${SEM_INTERFACE:-0}
      - SEM_CORRECAO=${SEM_CORRECAO:-0}
      - SESSAO=${SESSAO:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/workspace
    working_dir: /workspace
    # Ctrl+C (ou o fim de outro contentor) termina o processamento como a tecla Q: grava o resumo
    stop_signal: SIGINT
    stop_grace_period: 30s
    command: python3 processar_tempo_real.py

  gravador_bag:
    <<: *ros-realtime
    depends_on:
      - processador
    volumes:
      - ./data_realtime_inter:/data:rw
    stop_signal: SIGINT
    stop_grace_period: 30s
    environment:
      - CAMARAS_ATIVAS=${CAMARAS_ATIVAS}
      - SESSAO=${SESSAO:-}
    # (lista em vez de "command: >": o ">" do YAML juntava as linhas do script numa só e o bash
    #  dava erro de sintaxe, por isso o bag não era gravado)
    command:
      - bash
      - -c
      - |
        TOPICOS="/processamento/estado_camaras"
        for cam in $$CAMARAS_ATIVAS; do
          # O vídeo original (como na aquisição, secção 1) e o JSON das deteções de cada câmara
          TOPICOS="$$TOPICOS /camara$$cam/image_raw /camara$$cam/processamento/dados_deteccoes"
        done
        SESSAO="$${SESSAO:-realtime_$$(date +%Y%m%d_%H%M%S)}"
        sleep 4
        exec ros2 bag record -s mcap -o /data/$$SESSAO $$TOPICOS
