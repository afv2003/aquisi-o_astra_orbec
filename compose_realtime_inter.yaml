x-ros-realtime: &ros-realtime
  build:
    context: .
    dockerfile: Dockerfile_realtime_inter
    args:
      ONNX_PKG: ${ONNX_PKG:-onnxruntime}
  network_mode: host
  ipc: host

services:
  driver_camara5:
    <<: *ros-realtime
    privileged: true
    command: >
      ros2 run usb_cam usb_cam_node_exe --ros-args
      -r __ns:=/camara5
      -p video_device:=${DEV_CAMARA5:-/dev/video2}
      -p frame_id:=camara5
      -p camera_name:=astra_rgb_5

  driver_camara8:
    <<: *ros-realtime
    privileged: true
    command: >
      ros2 run usb_cam usb_cam_node_exe --ros-args
      -r __ns:=/camara8
      -p video_device:=${DEV_CAMARA8:-/dev/video4}
      -p frame_id:=camara8
      -p camera_name:=astra_rgb_8

  processador:
    <<: *ros-realtime
    depends_on:
      - driver_camara5
      - driver_camara8
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - CAMARAS_ATIVAS=${CAMARAS_ATIVAS}
      - SEM_INTERFACE=${SEM_INTERFACE:-0}
      - SEM_CORRECAO=${SEM_CORRECAO:-0}
      - SESSAO=${SESSAO:-}
      - REGISTAR_TUDO=${REGISTAR_TUDO:-0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/workspace
    working_dir: /workspace
    # O processamento também grava o bag (vídeo original e deteções), só nos trechos
    # (gravacao_online.py), em data_realtime_inter/<sessão>/ (a pasta do projeto está em /workspace).
    # Ctrl+C (ou o fim de outro contentor) termina o processamento como a tecla Q: fecha o bag e grava
    # o resumo
    stop_signal: SIGINT
    stop_grace_period: 30s
    command: python3 processar_tempo_real.py
