x-ros: &ros
  build: .
  network_mode: host
  ipc: host

# Duas câmaras Astra em simultâneo (5 e 8).
# Lançar com o gravar.sh, indicando que câmara está em cada /dev/video:
#   bash gravar.sh 5 8    (câmara 5 em /dev/video2, câmara 8 em /dev/video4)
# Cada câmara publica no seu tópico: /camara5/image_raw e /camara8/image_raw.
# Com privileged: true, os /dev/video do PC já estão visíveis dentro do contentor,
# por isso o driver abre diretamente o /dev/video indicado pelo gravar.sh.

services:
  driver_camara5:
    <<: *ros
    privileged: true
    command: >
      ros2 run usb_cam usb_cam_node_exe --ros-args
      -r __ns:=/camara5
      -p video_device:=${DEV_CAMARA5:?lance com bash gravar.sh 5 8}
      -p frame_id:=camara5
      -p camera_name:=astra_rgb_5

  driver_camara8:
    <<: *ros
    privileged: true
    command: >
      ros2 run usb_cam usb_cam_node_exe --ros-args
      -r __ns:=/camara8
      -p video_device:=${DEV_CAMARA8:?lance com bash gravar.sh 5 8}
      -p frame_id:=camara8
      -p camera_name:=astra_rgb_8

  rviz:
    <<: *ros
    depends_on:
      - driver_camara5
      - driver_camara8
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: rviz2 -f base_link

  # Um só bag com as duas câmaras (mesmo relógio, mesma gravação):
  # data/viagem_<data_hora>/ com os tópicos /camara5/image_raw e /camara8/image_raw.
  gravador_bag:
    <<: *ros
    depends_on:
      - driver_camara5
      - driver_camara8
    volumes:
      - ./data:/data:rw
    stop_signal: SIGINT
    stop_grace_period: 30s
    command: >
      bash -c "sleep 2 && ros2 bag record -s mcap -o /data/viagem_$$(date +%Y%m%d_%H%M%S) --topics /camara5/image_raw /camara8/image_raw"