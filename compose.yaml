x-ros: &ros
  build: .
  network_mode: host
  ipc: host

services:
  driver_camara:
    <<: *ros
    privileged: true
    command: ros2 run usb_cam usb_cam_node_exe --ros-args -p frame_id:=base_link -p video_device:=/dev/video2
    
  rviz:
    <<: *ros
    depends_on:
      - driver_camara
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: rviz2 -f base_link

  gravador_bag:
    <<: *ros
    depends_on:
      - driver_camara
    volumes:
      - ./data:/data:rw
    stop_signal: SIGINT
    stop_grace_period: 30s
    # CAMARA é obrigatório (5 ou 8): o bag fica com a designação no nome, ex. viagem_camara5_20261106_101500
    # Uso: CAMARA=5 docker compose up
    command: >
      bash -c "sleep 2 && ros2 bag record -s mcap -o /data/viagem_camara${CAMARA:?defina CAMARA (5 ou 8) antes de docker compose up}_$$(date +%Y%m%d_%H%M%S) --topics /image_raw"